<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Felices 70, Lichi!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="invitation-wrapper">
        <div class="card" id="invitation-card">
            
            <!-- Tapa de la tarjeta (Front and Back) -->
            <div class="card-cover">
                <!-- Frente -->
                <div class="cover-front">
                    <div class="border-decoration">
                        <div class="corner top-left"></div>
                        <div class="corner top-right"></div>
                        <div class="corner bottom-left"></div>
                        <div class="corner bottom-right"></div>
                    </div>
                    <div class="cover-content">
                        <span class="subtitle">Celebración Especial</span>
                        <h1 class="title">70</h1>
                        <h2 class="name">Lichi</h2>
                        <div class="tap-indicator">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M8 13v-8.5a1.5 1.5 0 0 1 3 0v13"/>
                                <path d="M11 11.5a1.5 1.5 0 0 1 3 0v6"/>
                                <path d="M14 10.5a1.5 1.5 0 0 1 3 0v7"/>
                                <path d="M17 11.5a1.5 1.5 0 0 1 3 0v4.5a6 6 0 0 1 -6 6h-2c-3.31 0 -6 -2.69 -6 -6v-9a1.5 1.5 0 0 1 3 0v7"/>
                            </svg>
                            <span>Tocar para abrir</span>
                        </div>
                    </div>
                </div>
                
                <!-- Interior Izquierdo (Reverso de la tapa) -->
                <div class="cover-back">
                    <div class="inner-decoration">
                        <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="flower-icon">
                            <path d="M12 22c4.97-1.35 8-5.74 8-10.5C20 6.64 16.59 2 12 2S4 6.64 4 11.5C4 16.26 7.03 20.65 12 22z"/>
                            <path d="M12 2v20"/>
                            <path d="M4 11.5h16"/>
                            <path d="M7 6l10 11"/>
                            <path d="M17 6L7 17"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Interior Derecho -->
            <div class="card-inside">
                <div class="border-decoration">
                    <div class="corner top-left"></div>
                    <div class="corner top-right"></div>
                    <div class="corner bottom-left"></div>
                    <div class="corner bottom-right"></div>
                </div>
                <div class="inside-content">
                    <h3>Estás Invitado</h3>
                    <p class="message">Me encantaría que me acompañes a celebrar mi cumpleaños rodeado de familia y amigos.</p>
                    
                    <div class="details">
                        <div class="detail-item">
                            <div class="icon-wrapper">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                                    <line x1="16" y1="2" x2="16" y2="6"/>
                                    <line x1="8" y1="2" x2="8" y2="6"/>
                                    <line x1="3" y1="10" x2="21" y2="10"/>
                                </svg>
                            </div>
                            <div class="detail-text">
                                <strong>17 de Octubre</strong>
                                <span>Jueves</span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <div class="icon-wrapper">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"/>
                                    <polyline points="12 6 12 12 16 14"/>
                                </svg>
                            </div>
                            <div class="detail-text">
                                <strong>20:30 hs</strong>
                                <span>Puntual</span>
                            </div>
                        </div>
                    </div>
                    
                    <button class="rsvp-button" onclick="alert('Funcionalidad de confirmación a implementar')">Confirmar Asistencia</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
